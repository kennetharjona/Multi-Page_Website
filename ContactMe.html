<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #080324;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Title with stroke + glow */
        h1 {
            color: #ffffff;
            font-size: 3em;
            -webkit-text-stroke: 2px #00ffff; /* stroke effect */
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; /* glowing effect */
        }

        .bscpestudent {
            color: #ffffff;
            font-size: 2em;
            -webkit-text-stroke: 1px #ff00ff;
            text-shadow: 0 0 8px #ff00ff, 0 0 15px #ff00ff;
        }

        .contact {
            color: #ffffff;
            font-size: 2em;
            -webkit-text-stroke: 1px #0f79db;
            text-shadow: 0 0 8px #00ffd0, 0 0 15px #00ffd0;
        }

        h3 {
            color: #ffffff;
            -webkit-text-stroke: 1px #035b32;
            text-shadow: 0 0 8px #00fff2, 0 0 15px #00fff2;
        }

        .border {
            background: #030442;
            padding: 15px;
            margin: 15px auto;
            border-radius: 8px;
            width: 60%;
            border: 2px solid #00ffcc; /* border color */
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ffcc; /* glowing border */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

    </style>
</head>
<body>

    <h1>John Kenneth L. Arjona</h1>
    <h2 class="bscpestudent">I'm a 4th Year BS Computer Engineering student</h2>
    <div class="border">
        <h2 class="contact">Contact Me:</h2>
        <h3><b>Email:</b> kennetharjona012824@gmail.com</h3>
        <h3><b>Telephone Number:</b> 0968 314 9149</h3>
        <h3><b>Address:</b> Barrracks II Tala Caloocan City</h3>
    </div>
</body>
</html>
