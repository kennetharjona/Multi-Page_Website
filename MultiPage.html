<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiPage-Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #080324;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Title with stroke + glow */
        h1 {
            color: #ffffff;
            font-size: 3em;
            -webkit-text-stroke: 2px #00ffff; /* stroke effect */
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; /* glowing effect */
        }

        h2 {
            color: #ffffff;
            font-size: 2em;
            -webkit-text-stroke: 1px #ff00ff;
            text-shadow: 0 0 8px #ff00ff, 0 0 15px #ff00ff;
        }

        a {
            color: #00ffff;
            font-size: 2em;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;         /* allows transform scaling */
            transition: transform 0.3s ease, text-shadow 0.3s ease;
        }

        a:hover {
            transform: scale(1.2);         /* grows bigger */
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }

        .border {
            background: #030442;
            padding: 15px;
            margin: 15px auto;
            border-radius: 8px;
            width: 60%;
            border: 2px solid #00ffcc; /* border color */
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ffcc; /* glowing border */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

    </style>
</head>
<body>

    <h1>John Kenneth L. Arjona</h1>
    <h2>I'm a 4th Year BS Computer Engineering student</h2>

        <a href="AboutMe.html" target="_blank">About Me</a>
        <a href="ContactMe.html" target="_blank">Contact Me</a>
    </div>
</body>
</html>
